<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cheat iPhone — iOS Home</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#181b22;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:white}.phone{width:min(390px,100vw);height:min(844px,100dvh);position:relative;overflow:hidden;border:7px solid #101115;border-radius:48px;background:#283a70;box-shadow:0 18px 70px #0008}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 80%,#f9a3a4 0%,transparent 44%),radial-gradient(ellipse at 80% 30%,#82a5ed 0%,transparent 48%),linear-gradient(155deg,#15295e,#745ba6 55%,#e78ba6);filter:saturate(1.2)}.wall:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 35%,#0003)}.status{position:absolute;top:13px;left:0;right:0;display:flex;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:650;z-index:4}.island{position:absolute;z-index:5;top:8px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#09090c;border-radius:25px}.view{position:absolute;inset:0;z-index:2;transition:opacity .3s,transform .3s}.hidden{opacity:0;pointer-events:none;transform:translateY(20px)}#lock{text-align:center;cursor:pointer}.lockicon{margin-top:65px;font-size:21px}.date{margin-top:28px;font-size:20px;font-weight:500}.clock{font-size:clamp(70px,20vw,86px);letter-spacing:-5px;font-weight:650;line-height:1.13}.lockbottom{position:absolute;bottom:36px;left:0;right:0;display:flex;align-items:center;justify-content:space-around}.circle{width:49px;height:49px;border-radius:50%;background:#17192377;display:grid;place-items:center;font-size:23px}.hint{position:absolute;bottom:112px;left:0;right:0;font-size:14px}.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:125px;height:5px;border-radius:8px;background:white;z-index:8;cursor:pointer}#pass{text-align:center;backdrop-filter:blur(24px);background:#16224d44}.passTitle{margin-top:125px;font-size:21px;font-weight:550}.dots{display:flex;justify-content:center;gap:18px;margin:22px 0 30px}.dot{height:13px;width:13px;border:1.5px solid white;border-radius:50%}.dot.on{background:white}.error{height:23px;font-size:13px;color:#fff}.keypad{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:14px 23px;margin-top:10px}.key{border:0;border-radius:50%;width:76px;height:76px;background:#ffffff36;color:white;font-size:32px;font-weight:350;cursor:pointer}.key:active{background:#ffffff88}.key.small{font-size:15px;background:transparent}.key.empty{visibility:hidden}#home{padding:65px 17px 25px}.widgets{display:flex;gap:12px;margin:12px 0 24px}.widget{background:#ffffff3b;backdrop-filter:blur(18px);border:1px solid #ffffff45;border-radius:20px;padding:15px;flex:1;height:112px}.widget strong{display:block;font-size:29px;margin-top:5px}.widget small{font-size:12px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px}.app{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:white;font-size:11px;text-shadow:0 1px 3px #0006;cursor:pointer}.appicon{overflow:hidden;width:59px;height:59px;border-radius:15px;display:grid;place-items:center;font-size:27px;box-shadow:0 3px 9px #0002;background:#fff;color:#222;text-shadow:none}.dock{position:absolute;bottom:26px;left:12px;right:12px;display:flex;justify-content:space-around;background:#ffffff50;backdrop-filter:blur(22px);border-radius:27px;padding:11px 5px}.appicon svg,.appicon img{width:100%;height:100%;display:block}.appicon img{object-fit:cover}.dock .app span:last-child{display:none}.dock .appicon{width:60px;height:60px}.toast{position:absolute;z-index:10;top:70px;left:22px;right:22px;border-radius:18px;background:#ffffffdc;color:#222;padding:15px;text-align:center;font-size:14px;box-shadow:0 5px 20px #0003;display:none}.lockbtn{position:absolute;right:16px;top:105px;border:1px solid #ffffff80;background:#ffffff30;color:white;border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}@media(max-width:450px){.phone{border:0;border-radius:0;width:100vw;height:100dvh}.clock{font-size:82px}}@media(max-height:700px){.widgets{margin-bottom:15px}.apps{gap:12px 8px}.appicon{width:49px;height:49px}.dock .appicon{width:50px;height:50px}.keypad{gap:6px 20px}.key{width:66px;height:66px}.passTitle{margin-top:85px}}

/* V5: realistic iOS-style status indicators and lock-screen shortcuts */
.status{top:17px;left:0;right:0;padding:0 25px;align-items:center;font-size:14px;letter-spacing:-.15px;pointer-events:none}
.status-left,.status-right{display:flex;align-items:center;gap:7px;white-space:nowrap}
.status-left{gap:8px}.status-right{gap:7px}.status svg{display:block;flex:none}
.status .carrier{font-weight:600}.status .battery-number{font-size:11px;font-weight:750;fill:white}
.lockbottom{bottom:39px;justify-content:space-between;padding:0 29px;z-index:6;pointer-events:none}
.lockbottom .circle{width:51px;height:51px;border:1px solid #ffffff42;background:rgba(30,32,38,.34);backdrop-filter:blur(15px) saturate(140%);-webkit-backdrop-filter:blur(15px) saturate(140%);box-shadow:inset 0 1px 1px #ffffff36,0 3px 12px #0002;color:white;cursor:pointer;pointer-events:auto;padding:0;transition:transform .12s,background .15s}
.lockbottom .circle:active{transform:scale(.93);background:#ffffff55}.lockbottom .circle svg{width:26px;height:26px;display:block}
.lockbottom .circle.active{background:#f8f8f8d9;color:#1d1d1f}
@media(max-height:700px){.lockbottom{bottom:34px}}
</style>
</head>
<body>
<div class="phone">
<div class="wall"></div><div class="island"></div>
<div class="status" aria-label="상태 표시줄"><div class="status-left"><span class="carrier">GOV</span><svg width="17" height="18" viewBox="0 0 24 24" aria-label="무음" role="img"><path d="M17 9V7a5 5 0 0 0-8.5-3.5M6.6 7.5C6.2 8.6 6 9.8 6 11v3l-2 3h14M10 21h4" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 3l18 18" stroke="white" stroke-width="2.4" stroke-linecap="round"/></svg></div><div class="status-right"><svg width="20" height="17" viewBox="0 0 20 17" aria-label="셀룰러 신호" role="img"><rect x="0" y="11" width="3.5" height="6" rx="1.5" fill="white"/><rect x="5.5" y="8" width="3.5" height="9" rx="1.5" fill="white"/><rect x="11" y="4" width="3.5" height="13" rx="1.5" fill="white"/><rect x="16.5" y="0" width="3.5" height="17" rx="1.5" fill="white"/></svg><svg width="21" height="17" viewBox="0 0 24 20" aria-label="Wi-Fi" role="img"><path d="M2 6.5C7.5 1.5 16.5 1.5 22 6.5M5.6 10.6c3.7-3.4 9.1-3.4 12.8 0M9.4 14.6a4 4 0 0 1 5.2 0" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="18" r="1.7" fill="white"/></svg><svg width="32" height="17" viewBox="0 0 36 19" aria-label="배터리 80%" role="img"><rect x="1" y="1" width="30" height="17" rx="5" fill="none" stroke="white" stroke-opacity=".85" stroke-width="1.5"/><rect x="3.2" y="3.1" width="23.5" height="12.8" rx="3.1" fill="white"/><path d="M33 6.2c2 1 2 5.5 0 6.5" fill="none" stroke="white" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/><text x="15" y="13.6" text-anchor="middle" font-size="10.5" font-family="-apple-system,Arial" font-weight="800" fill="#555">80</text></svg></div></div>
<section id="lock" class="view" aria-label="잠금 화면"><div class="lockicon">🔒</div><div class="date" id="lockDate"></div><div class="clock" id="lockTime">9:41</div><div class="hint">화면을 탭하거나 위로 스와이프하세요</div><div class="lockbottom"><button class="circle" type="button" id="flashlightButton" aria-label="손전등 켜기" title="손전등"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 3h12v5H10zM10.5 10h11l-2.5 6v11.5a2.5 2.5 0 0 1-2.5 2.5h-1a2.5 2.5 0 0 1-2.5-2.5V16z" fill="currentColor"/><circle cx="16" cy="23.5" r="1.6" fill="#777"/></svg></button><button class="circle" type="button" id="cameraButton" aria-label="카메라 열기" title="카메라"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 7l2.2-3h7.6L22 7h4a3.5 3.5 0 0 1 3.5 3.5v15A3.5 3.5 0 0 1 26 29H6a3.5 3.5 0 0 1-3.5-3.5v-15A3.5 3.5 0 0 1 6 7z" fill="currentColor"/><circle cx="16" cy="17.5" r="7.1" fill="#747880"/><circle cx="16" cy="17.5" r="4.8" fill="currentColor"/><circle cx="25.5" cy="11.2" r="1.2" fill="#747880"/></svg></button></div></section>
<section id="pass" class="view hidden" aria-label="비밀번호 입력"><div class="passTitle">암호 입력</div><div class="dots" id="dots"></div><div class="error" id="error"></div><div class="keypad" id="keypad"></div></section>
<section id="home" class="view hidden" aria-label="홈 화면"><button class="lockbtn" id="lockButton">🔒 잠그기</button><div class="widgets"><div class="widget"><small id="widgetDate">금요일</small><strong id="widgetDay">23</strong><small>캘린더</small></div><div class="widget"><small>날씨</small><strong>☀️</strong><small>나의 도시 · 맑음</small></div></div><div class="apps" id="apps"></div><div class="dock" id="dock"></div></section>
<div class="toast" id="toast"></div><div class="homebar" id="homebar"></div>
</div>
<script>
const PIN='0831';let entered='',current='lock',toastTimer;
const $=id=>document.getElementById(id);
function show(id){['lock','pass','home'].forEach(x=>$(x).classList.toggle('hidden',x!==id));current=id;if(id==='pass'){entered='';$('error').textContent='';updateDots()}}
function updateDots(){$('dots').innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<entered.length?'on':''}"></span>`).join('')}
function digit(n){if(entered.length>=4)return;entered+=n;updateDots();if(entered.length===4){setTimeout(()=>{if(entered===PIN){show('home')}else{$('error').textContent='암호가 올바르지 않습니다';entered='';updateDots()}},200)}}
function del(){entered=entered.slice(0,-1);updateDots()}
const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];$('keypad').innerHTML=keys.map(k=>`<button class="key ${k==='⌫'?'small':''} ${!k?'empty':''}" data-key="${k}" ${!k?'disabled':''}>${k}</button>`).join('');$('keypad').addEventListener('click',e=>{let k=e.target.closest('button')?.dataset.key;if(k==='⌫')del();else if(/^\d$/.test(k))digit(k)});
function toastMessage(message){const t=$('toast');t.textContent=message;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2200)}
$('flashlightButton').addEventListener('click',e=>{e.stopPropagation();const b=e.currentTarget;b.classList.toggle('active');b.setAttribute('aria-label',b.classList.contains('active')?'손전등 끄기':'손전등 켜기');toastMessage(b.classList.contains('active')?'손전등 켜짐 (화면 연출)':'손전등 꺼짐')});
$('cameraButton').addEventListener('click',e=>{e.stopPropagation();toastMessage('카메라 화면은 다음 단계에서 구현할 예정이야!')});
$('lock').addEventListener('click',e=>{if(e.target.closest('.lockbottom'))return;show('pass')});let touchStart=0;$('lock').addEventListener('touchstart',e=>touchStart=e.touches[0].clientY,{passive:true});$('lock').addEventListener('touchend',e=>{if(touchStart-e.changedTouches[0].clientY>35)show('pass')},{passive:true});$('lockButton').onclick=()=>show('lock');$('homebar').onclick=()=>{if(current==='home')show('lock');else if(current==='lock')show('pass');else show('lock')};
const iconSVG={
'설정':'<g fill="none" stroke="#6a6e75" stroke-width="7"><circle cx="32" cy="32" r="15"/><circle cx="32" cy="32" r="7" fill="#8b9099" stroke="none"/></g><path fill="#777c85" d="M27 5h10l2 7 6 3 7-3 7 8-4 6 1 7 6 5-4 10-8-1-5 5-1 8H27l-2-8-6-4-8 1-4-10 6-5 1-7-4-6 7-8 7 3 6-3z" fill-rule="evenodd" opacity=".8"/><circle cx="32" cy="32" r="12" fill="#d9dce1"/><circle cx="32" cy="32" r="6" fill="#707780"/>',
'날씨':'<circle cx="39" cy="22" r="12" fill="#ffd343"/><path d="M16 46h33a11 11 0 0 0-3-21 17 17 0 0 0-31 6A8 8 0 0 0 16 46" fill="#fff"/>',
'카메라':'<rect x="9" y="18" width="46" height="32" rx="7" fill="#555b63"/><path d="M20 18l4-6h16l4 6" fill="#737982"/><circle cx="32" cy="34" r="12" fill="#202a37" stroke="#aab0b9" stroke-width="3"/><circle cx="32" cy="34" r="7" fill="#4e738f"/><circle cx="49" cy="23" r="2" fill="#e9edf0"/>',
'캘린더':'<rect x="0" y="0" width="64" height="64" rx="13" fill="white"/><text x="32" y="17" font-size="11" fill="#e34a45" text-anchor="middle" font-weight="700">금요일</text><text x="32" y="52" font-size="36" fill="#222" text-anchor="middle" id="calendarIconDay">23</text>',
'알람':'<circle cx="32" cy="32" r="23" fill="white" stroke="#202020" stroke-width="2"/><path d="M32 15v18l13 8" stroke="#202020" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="32" cy="32" r="2.5" fill="#222"/>',
'FaceTime':'<rect x="8" y="17" width="34" height="30" rx="8" fill="white"/><path d="M43 26l13-9v30l-13-9z" fill="white"/>',
'Safari':'<circle cx="32" cy="32" r="26" fill="#fff"/><circle cx="32" cy="32" r="23" fill="#159de8"/><path d="M40 22l-7 14-10 7 7-15z" fill="#fff"/><path d="M40 22l-7 14-3-8z" fill="#e84d4d"/>',
'메일':'<rect x="7" y="16" width="50" height="34" rx="5" fill="white"/><path d="M9 20l23 17 23-17" fill="none" stroke="#2c92ed" stroke-width="2"/>',
'메모':'<rect x="0" y="0" width="64" height="64" rx="13" fill="#fff"/><path d="M0 13h64v12H0z" fill="#f8d94c"/><path d="M12 36h40M12 44h40M12 52h29" stroke="#d3d4d7" stroke-width="2"/>',
'Instagram':'<defs><linearGradient id="ig" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#ffcf50"/><stop offset=".35" stop-color="#fb3666"/><stop offset=".7" stop-color="#bc39b4"/><stop offset="1" stop-color="#6b54d8"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#ig)"/><rect x="15" y="15" width="34" height="34" rx="10" fill="none" stroke="white" stroke-width="4"/><circle cx="32" cy="32" r="9" fill="none" stroke="white" stroke-width="4"/><circle cx="44" cy="20" r="3" fill="white"/>',
'전화':'<path d="M19 10c-4-2-10 3-9 10 2 15 20 33 35 35 7 1 12-5 10-9l-11-8-8 6c-8-4-12-8-16-16l6-8z" fill="white"/>',
'메시지':'<path d="M32 10c-16 0-26 10-26 22 0 8 5 15 13 19l-2 8 12-6c17 2 29-8 29-21S47 10 32 10" fill="white"/>',
'카카오톡':'<ellipse cx="32" cy="29" rx="25" ry="20" fill="#382719"/><path d="M20 44l-4 12 16-9" fill="#382719"/><text x="32" y="35" font-size="18" font-weight="900" text-anchor="middle" fill="#fee500">TALK</text>',
'갤러리':'<g transform="translate(32 32)"><ellipse cy="-13" rx="8" ry="17" fill="#ef5556"/><ellipse cy="-13" rx="8" ry="17" fill="#f7aa43" transform="rotate(45)"/><ellipse cy="-13" rx="8" ry="17" fill="#f5d34c" transform="rotate(90)"/><ellipse cy="-13" rx="8" ry="17" fill="#6acb78" transform="rotate(135)"/><ellipse cy="-13" rx="8" ry="17" fill="#54bde8" transform="rotate(180)"/><ellipse cy="-13" rx="8" ry="17" fill="#6377d9" transform="rotate(225)"/><ellipse cy="-13" rx="8" ry="17" fill="#b075cb" transform="rotate(270)"/><ellipse cy="-13" rx="8" ry="17" fill="#e783b5" transform="rotate(315)"/><circle r="5" fill="white"/></g>'};
const apps=['설정','날씨','카메라','캘린더','알람','FaceTime','Safari','메일','메모','Instagram'];
const dock=['전화','메시지','카카오톡','갤러리'];
const colors={'설정':'#d9dce2','날씨':'linear-gradient(#167cde,#78c9f5)','카메라':'linear-gradient(#eef0f3,#b6bac1)','캘린더':'#fff','알람':'#fff','FaceTime':'#35c85d','Safari':'#fff','메일':'#2189ed','메모':'#fff','Instagram':'#fff','전화':'#35c95d','메시지':'#43ca62','카카오톡':'#fee500','갤러리':'#fff'};
const customIcons={'전화':'phone.png','메시지':'messages.png','카카오톡':'kakao.png','갤러리':'photos.png','메일':'mail.png','Instagram':'instagram.png','설정':'settings.png','날씨':'weather.png','Safari':'safari.png'};
function makeApp(name){const b=document.createElement('button');b.className='app';b.setAttribute('aria-label',name);const icon=document.createElement('span');icon.className='appicon';icon.style.background=colors[name];if(customIcons[name]){const img=document.createElement("img");img.src="icons/"+customIcons[name];img.alt="";icon.appendChild(img)}else{icon.innerHTML=`<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">${iconSVG[name]}</svg>`;}const label=document.createElement('span');label.textContent=name;b.append(icon,label);b.onclick=()=>{const t=$('toast');t.textContent=`${name} 앱은 다음 단계에서 구현할 예정이야!`;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2400)};return b}
apps.forEach(a=>$('apps').appendChild(makeApp(a)));dock.forEach(a=>$('dock').appendChild(makeApp(a)));
function clock(){const d=new Date(),hm=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),date=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('statusTime').textContent=hm;$('lockTime').textContent=hm;$('lockDate').textContent=date;$('widgetDay').textContent=d.getDate();$('widgetDate').textContent=d.toLocaleDateString('ko-KR',{weekday:'long'});const cd=document.getElementById('calendarIconDay');if(cd)cd.textContent=d.getDate()}clock();setInterval(clock,15000);updateDots();
</script>
</body></html>
