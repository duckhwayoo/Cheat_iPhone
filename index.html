<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cheat iPhone</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#181b22;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:white}.phone{width:min(390px,100vw);height:min(844px,100dvh);position:relative;overflow:hidden;border:7px solid #101115;border-radius:48px;background:#283a70;box-shadow:0 18px 70px #0008}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 80%,#f9a3a4 0%,transparent 44%),radial-gradient(ellipse at 80% 30%,#82a5ed 0%,transparent 48%),linear-gradient(155deg,#15295e,#745ba6 55%,#e78ba6);filter:saturate(1.2)}.wall:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 35%,#0003)}.status{position:absolute;top:13px;left:0;right:0;display:flex;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:650;z-index:4}.island{position:absolute;z-index:5;top:8px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#09090c;border-radius:25px}.view{position:absolute;inset:0;z-index:2;transition:opacity .3s,transform .3s}.hidden{opacity:0;pointer-events:none;transform:translateY(20px)}#lock{text-align:center;cursor:pointer}.lockicon{margin-top:65px;font-size:21px}.date{margin-top:28px;font-size:20px;font-weight:500}.clock{font-size:clamp(70px,20vw,86px);letter-spacing:-5px;font-weight:650;line-height:1.13}.lockbottom{position:absolute;bottom:36px;left:0;right:0;display:flex;align-items:center;justify-content:space-around}.circle{width:49px;height:49px;border-radius:50%;background:#17192377;display:grid;place-items:center;font-size:23px}.hint{position:absolute;bottom:112px;left:0;right:0;font-size:14px}.homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:125px;height:5px;border-radius:8px;background:white;z-index:8;cursor:pointer}#pass{text-align:center;backdrop-filter:blur(24px);background:#16224d44}.passTitle{margin-top:125px;font-size:21px;font-weight:550}.dots{display:flex;justify-content:center;gap:18px;margin:22px 0 30px}.dot{height:13px;width:13px;border:1.5px solid white;border-radius:50%}.dot.on{background:white}.error{height:23px;font-size:13px;color:#fff}.keypad{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:14px 23px;margin-top:10px}.key{border:0;border-radius:50%;width:76px;height:76px;background:#ffffff36;color:white;font-size:32px;font-weight:350;cursor:pointer}.key:active{background:#ffffff88}.key.small{font-size:15px;background:transparent}.key.empty{visibility:hidden}#home{padding:65px 17px 25px}.widgets{display:flex;gap:12px;margin:12px 0 24px}.widget{background:#ffffff3b;backdrop-filter:blur(18px);border:1px solid #ffffff45;border-radius:20px;padding:15px;flex:1;height:112px}.widget strong{display:block;font-size:29px;margin-top:5px}.widget small{font-size:12px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px}.app{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:white;font-size:11px;text-shadow:0 1px 3px #0006;cursor:pointer}.appicon{width:59px;height:59px;border-radius:15px;display:grid;place-items:center;font-size:27px;box-shadow:0 3px 9px #0002;background:#fff;color:#222;text-shadow:none}.dock{position:absolute;bottom:26px;left:12px;right:12px;display:flex;justify-content:space-around;background:#ffffff50;backdrop-filter:blur(22px);border-radius:27px;padding:11px 5px}.dock .appicon{width:60px;height:60px}.toast{position:absolute;z-index:10;top:70px;left:22px;right:22px;border-radius:18px;background:#ffffffdc;color:#222;padding:15px;text-align:center;font-size:14px;box-shadow:0 5px 20px #0003;display:none}.lockbtn{position:absolute;right:16px;top:105px;border:1px solid #ffffff80;background:#ffffff30;color:white;border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer}@media(max-width:450px){.phone{border:0;border-radius:0;width:100vw;height:100dvh}.clock{font-size:82px}}@media(max-height:700px){.widgets{margin-bottom:15px}.apps{gap:12px 8px}.appicon{width:49px;height:49px}.dock .appicon{width:50px;height:50px}.keypad{gap:6px 20px}.key{width:66px;height:66px}.passTitle{margin-top:85px}}
</style>
</head>
<body>
<div class="phone">
<div class="wall"></div><div class="island"></div>
<div class="status"><span id="statusTime">9:41</span><span>●●● ▰ ◕</span></div>
<section id="lock" class="view" aria-label="잠금 화면"><div class="lockicon">🔒</div><div class="date" id="lockDate"></div><div class="clock" id="lockTime">9:41</div><div class="hint">화면을 탭하거나 위로 스와이프하세요</div><div class="lockbottom"><div class="circle">⌁</div><div class="circle">◎</div></div></section>
<section id="pass" class="view hidden" aria-label="비밀번호 입력"><div class="passTitle">암호 입력</div><div class="dots" id="dots"></div><div class="error" id="error"></div><div class="keypad" id="keypad"></div></section>
<section id="home" class="view hidden" aria-label="홈 화면"><button class="lockbtn" id="lockButton">🔒 잠그기</button><div class="widgets"><div class="widget"><small id="widgetDate">금요일</small><strong id="widgetDay">23</strong><small>캘린더</small></div><div class="widget"><small>날씨</small><strong>☀️</strong><small>나의 도시 · 맑음</small></div></div><div class="apps" id="apps"></div><div class="dock" id="dock"></div></section>
<div class="toast" id="toast"></div><div class="homebar" id="homebar"></div>
</div>
<script>
const PIN='0831';let entered='',current='lock',toastTimer;
const $=id=>document.getElementById(id);
function show(id){['lock','pass','home'].forEach(x=>$(x).classList.toggle('hidden',x!==id));current=id;if(id==='pass'){entered='';$('error').textContent='';updateDots()}}
function updateDots(){$('dots').innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<entered.length?'on':''}"></span>`).join('')}
function digit(n){if(entered.length>=4)return;entered+=n;updateDots();if(entered.length===4){setTimeout(()=>{if(entered===PIN){show('home')}else{$('error').textContent='암호가 올바르지 않습니다';entered='';updateDots()}},200)}}
function del(){entered=entered.slice(0,-1);updateDots()}
const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];$('keypad').innerHTML=keys.map(k=>`<button class="key ${k==='⌫'?'small':''} ${!k?'empty':''}" data-key="${k}" ${!k?'disabled':''}>${k}</button>`).join('');$('keypad').addEventListener('click',e=>{let k=e.target.closest('button')?.dataset.key;if(k==='⌫')del();else if(/^\d$/.test(k))digit(k)});
$('lock').addEventListener('click',()=>show('pass'));let touchStart=0;$('lock').addEventListener('touchstart',e=>touchStart=e.touches[0].clientY,{passive:true});$('lock').addEventListener('touchend',e=>{if(touchStart-e.changedTouches[0].clientY>35)show('pass')},{passive:true});$('lockButton').onclick=()=>show('lock');$('homebar').onclick=()=>{if(current==='home')show('lock');else if(current==='lock')show('pass');else show('lock')};
const apps=[['설정','⚙️','#a9adb6'],['날씨','🌤️','#50a8fa'],['카메라','📷','#d7d8dc'],['캘린더','📅','#fff'],['알람','⏰','#fff'],['FaceTime','📹','#3fc766'],['Safari','🧭','#f7f7f7'],['메일','✉️','#298afa'],['메모','📝','#fff2aa'],['Instagram','📸','#dc69a4']];const dock=[['전화','☎','#36c85c'],['메시지','💬','#3bbd6a'],['카카오톡','💬','#fee500'],['갤러리','🌈','#fff']];function makeApp([name,emoji,color]){const b=document.createElement('button');b.className='app';b.innerHTML=`<span class="appicon" style="background:${color}">${emoji}</span><span>${name}</span>`;b.onclick=()=>{const t=$('toast');t.textContent=`${name} 앱은 다음 단계에서 구현할 예정이야!`;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2400)};return b}apps.forEach(a=>$('apps').appendChild(makeApp(a)));dock.forEach(a=>$('dock').appendChild(makeApp(a)));
function clock(){const d=new Date(),hm=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),date=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('statusTime').textContent=hm;$('lockTime').textContent=hm;$('lockDate').textContent=date;$('widgetDay').textContent=d.getDate();$('widgetDate').textContent=d.toLocaleDateString('ko-KR',{weekday:'long'})}clock();setInterval(clock,15000);updateDots();
</script>
</body></html>
