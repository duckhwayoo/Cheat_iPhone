<script>
const PIN='0831';let entered='',current='lock',toastTimer;
const $=id=>document.getElementById(id);
function show(id){['lock','pass','home'].forEach(x=>$(x).classList.toggle('hidden',x!==id));current=id;if(id==='pass'){entered='';$('error').textContent='';updateDots()}}
function updateDots(){$('dots').innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<entered.length?'on':''}"></span>`).join('')}
function digit(n){if(entered.length>=4)return;entered+=n;updateDots();if(entered.length===4){setTimeout(()=>{if(entered===PIN){show('home')}else{$('error').textContent='암호가 올바르지 않습니다';entered='';updateDots()}},200)}}
function del(){entered=entered.slice(0,-1);updateDots()}
const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];$('keypad').innerHTML=keys.map(k=>`<button class="key ${k==='⌫'?'small':''} ${!k?'empty':''}" data-key="${k}" ${!k?'disabled':''}>${k}</button>`).join('');$('keypad').addEventListener('click',e=>{let k=e.target.closest('button')?.dataset.key;if(k==='⌫')del();else if(/^\d$/.test(k))digit(k)});
function toastMessage(message){const t=$('toast');t.textContent=message;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2200)}
$('flashlightButton').addEventListener('click',e=>{e.stopPropagation();const b=e.currentTarget;b.classList.toggle('active');b.setAttribute('aria-label',b.classList.contains('active')?'손전등 끄기':'손전등 켜기');toastMessage(b.classList.contains('active')?'손전등 켜짐 (화면 연출)':'손전등 꺼짐')});
$('cameraButton').addEventListener('click',e=>{e.stopPropagation();toastMessage('카메라 화면은 다음 단계에서 구현할 예정이야!')});
$('lock').addEventListener('click',e=>{if(e.target.closest('.lockbottom'))return;show('pass')});let touchStart=0;$('lock').addEventListener('touchstart',e=>touchStart=e.touches[0].clientY,{passive:true});$('lock').addEventListener('touchend',e=>{if(touchStart-e.changedTouches[0].clientY>35)show('pass')},{passive:true});$('lockButton').onclick=()=>show('lock');$('homebar').onclick=()=>{if(current==='phone'){closePhone();}else if(current==='messages'){if(activeMessageThread!==null)closeMessageThread();else closeMessages();}else if(current==='home')show('lock');else if(current==='lock')show('pass');else show('lock')};
const iconSVG={
'설정':'<g fill="none" stroke="#6a6e75" stroke-width="7"><circle cx="32" cy="32" r="15"/><circle cx="32" cy="32" r="7" fill="#8b9099" stroke="none"/></g><path fill="#777c85" d="M27 5h10l2 7 6 3 7-3 7 8-4 6 1 7 6 5-4 10-8-1-5 5-1 8H27l-2-8-6-4-8 1-4-10 6-5 1-7-4-6 7-8 7 3 6-3z" fill-rule="evenodd" opacity=".8"/><circle cx="32" cy="32" r="12" fill="#d9dce1"/><circle cx="32" cy="32" r="6" fill="#707780"/>',
'날씨':'<circle cx="39" cy="22" r="12" fill="#ffd343"/><path d="M16 46h33a11 11 0 0 0-3-21 17 17 0 0 0-31 6A8 8 0 0 0 16 46" fill="#fff"/>',
'카메라':'<rect x="9" y="18" width="46" height="32" rx="7" fill="#555b63"/><path d="M20 18l4-6h16l4 6" fill="#737982"/><circle cx="32" cy="34" r="12" fill="#202a37" stroke="#aab0b9" stroke-width="3"/><circle cx="32" cy="34" r="7" fill="#4e738f"/><circle cx="49" cy="23" r="2" fill="#e9edf0"/>',

'카카오톡':'<ellipse cx="32" cy="29" rx="25" ry="20" fill="#382719"/><path d="M20 44l-4 12 16-9" fill="#382719"/><text x="32" y="35" font-size="18" font-weight="900" text-anchor="middle" fill="#fee500">TALK</text>',

const colors={'설정':'#d9dce2','날씨':'linear-gradient(#167cde,#78c9f5)','카메라':'linear-gradient(#eef0f3,#b6bac1)','캘린더':'#fff','알람':'#fff','FaceTime':'#35c85d','Safari':'#fff','메일':'#2189ed','메모':'#fff','Instagram':'#fff','전화':'#35c95d','메시지':'#43ca62','카카오톡':'#fee500','갤러리':'#fff'};

let activeMessageThread=null;
const messagePersonSvg='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="17" r="9" fill="#fff"/><path d="M7 42c2-12 32-12 34 0" fill="#fff"/></svg>';
function showMessageThread(index){
 if(index<0||index>2)return;
 activeMessageThread=index;
 const t=messageThreads[index];
 $('messageThreadName').textContent=t.name;
 $('messageAvatar').innerHTML=t.heart?'♥':messagePersonSvg;
 const scroll=$('messageChatScroll');
 scroll.innerHTML=chatContents[index].map(([kind,txt])=>kind==='day'
  ? `<div class="m-day">${escapeHTML(txt)}</div>`
  : `<div class="m-bubble-row ${kind}"><div class="m-bubble ${index===0?'':'web'}">${escapeHTML(txt)}</div></div>`).join('');
 $('messageConversation').classList.add('open');
 requestAnimationFrame(()=>{scroll.scrollTop=scroll.scrollHeight});
}
function closeMessageThread(){
 activeMessageThread=null;
 $('messageConversation').classList.remove('open');
}
$('messageBack').onclick=closeMessageThread;
$('messageList').addEventListener('click',e=>{
 const row=e.target.closest('[data-thread]');
 if(row)showMessageThread(Number(row.dataset.thread));
});
$('messageList').addEventListener('keydown',e=>{
 if(e.key==='Enter'){const row=e.target.closest('[data-thread]');if(row)showMessageThread(Number(row.dataset.thread))}
});

function openMessages(){
 show('home');current='messages';$('messagesApp').classList.add('active');
 $('homebar').style.background='#111';$('homebar').style.zIndex='12';
 const status=document.querySelector('.status');status.classList.add('inphone');status.style.color='#000';
 status.querySelector('.status-right')?.style.setProperty('filter','brightness(0)');
 document.querySelector('.island').classList.add('inphone');
 renderMessages();
}
function closeMessages(){
 closeMessageThread();
 $('messagesApp').classList.remove('active');
 $('homebar').style.background='white';$('homebar').style.zIndex='8';
 const status=document.querySelector('.status');status.classList.remove('inphone');status.style.color='';
 status.querySelector('.status-right')?.style.removeProperty('filter');
 document.querySelector('.island').classList.remove('inphone');current='home';
}
